<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>복합기 렌탈장부</title>
<meta name="theme-color" content="#191919">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="렌탈장부">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#F6F5F1; --card:#FFFFFF; --ink:#1A1A1A; --ink2:#71706A; --line:#E4E2DA;
  --cyan:#0E86AD; --cyan-bg:#E2F1F6;
  --mag:#CE1477;  --mag-bg:#FBE6F1;
  --yel:#8A6D00;  --yel-bg:#F9F0C8;
  --r:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{font-size:17px;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;
  line-height:1.45; word-break:keep-all;
}
button{font-family:inherit; font-size:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit;}

/* ---------- 컬러바 (CMYK 시그니처) ---------- */
.cbar{display:inline-flex; gap:3px; vertical-align:middle;}
.cbar i{width:9px; height:9px; display:block;}
.cbar i:nth-child(1){background:#2BA8D6;}
.cbar i:nth-child(2){background:#E5147E;}
.cbar i:nth-child(3){background:#F5C400;}
.cbar i:nth-child(4){background:#1A1A1A;}

/* ---------- 공통 레이아웃 ---------- */
#app{max-width:720px; margin:0 auto; min-height:100vh; padding-bottom:120px;}
.topbar{
  position:sticky; top:0; z-index:20; background:var(--paper);
  display:flex; align-items:center; gap:10px;
  padding:14px 16px 12px; border-bottom:1px solid var(--line);
}
.topbar h1{font-size:1.25rem; font-weight:800; margin:0; letter-spacing:-0.02em; display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
.topbar h1 span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.iconbtn{
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  width:46px; height:46px; border-radius:12px; font-size:1.15rem;
  display:flex; align-items:center; justify-content:center; flex:none;
}
.iconbtn:active{transform:scale(.96);}
.backbtn{border:none; background:none; font-size:1.5rem; padding:4px 10px 4px 0; color:var(--ink); flex:none;}

.section{padding:16px;}
.sec-title{font-size:.85rem; font-weight:700; color:var(--ink2); letter-spacing:.06em; margin:22px 2px 10px; display:flex; align-items:center; gap:8px;}

/* ---------- 카드 ---------- */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:16px; margin-bottom:12px; box-shadow:0 1px 2px rgba(20,20,20,.04);
}
.co-card{display:flex; flex-direction:column; gap:8px;}
.co-card .row1{display:flex; align-items:flex-start; gap:10px;}
.co-card .name{font-size:1.2rem; font-weight:800; flex:1; min-width:0; letter-spacing:-0.01em;}
.co-card .row2{display:flex; align-items:center; gap:8px; flex-wrap:wrap; color:var(--ink2); font-size:.95rem;}
.co-card{cursor:pointer;}
.co-card:active{background:#FBFAF7;}
.co-card.closed{opacity:.62;}
.callbtn{
  border:1px solid var(--line); background:var(--paper); border-radius:12px;
  padding:9px 14px; font-size:.95rem; font-weight:700; color:var(--ink);
  text-decoration:none; display:inline-flex; align-items:center; gap:6px; flex:none;
}

/* ---------- 칩 ---------- */
.chip{
  display:inline-flex; align-items:center; border-radius:999px;
  padding:4px 11px; font-size:.85rem; font-weight:800;
  font-feature-settings:'tnum'; white-space:nowrap;
}
.chip.gray{background:#EFEEE8; color:var(--ink2);}
.chip.cyan{background:var(--cyan-bg); color:var(--cyan);}
.chip.mag{background:var(--mag-bg); color:var(--mag);}
.chip.yel{background:var(--yel-bg); color:var(--yel);}
.chip.fill-mag{background:var(--mag); color:#fff;}
.chip.fill-cyan{background:var(--cyan); color:#fff;}

/* ---------- 상세: 장부 행 ---------- */
.ledger{background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden;}
.lrow{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line);}
.lrow:last-child{border-bottom:none;}
.lrow .k{width:88px; flex:none; color:var(--ink2); font-size:.9rem; font-weight:600;}
.lrow .v{flex:1; min-width:0; font-weight:600; overflow-wrap:anywhere;}
.lrow .v.dim{color:var(--ink2); font-weight:500;}
.memo-block{white-space:pre-wrap; font-weight:500;}

/* ---------- 기기 카드 ---------- */
.mc .head{display:flex; align-items:flex-start; gap:10px; margin-bottom:6px;}
.mc .model{font-size:1.08rem; font-weight:800; flex:1; min-width:0;}
.mc .serial{color:var(--ink2); font-size:.88rem; font-weight:600;}
.mc .chips{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 4px;}
.mc .info{color:var(--ink); font-size:.95rem; margin-top:6px;}
.mc .info b{font-weight:800; font-feature-settings:'tnum';}
.mc .info .lbl{color:var(--ink2); font-weight:600;}
.mc .memo{color:var(--ink2); font-size:.9rem; margin-top:8px; white-space:pre-wrap;}
.editlink{border:none; background:none; color:var(--cyan); font-weight:700; font-size:.95rem; padding:6px 2px; flex:none;}

/* ---------- 버튼 ---------- */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; min-height:54px; border-radius:var(--r); font-size:1.05rem; font-weight:800;
  border:1px solid var(--ink); background:var(--ink); color:var(--paper);
}
.btn:active{transform:scale(.985);}
.btn.line{background:var(--card); color:var(--ink); border:1px solid var(--line);}
.btn.danger{background:none; border:none; color:var(--mag); font-weight:700; min-height:48px;}
.fab{
  position:fixed; bottom:max(20px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  z-index:30; border:none; background:var(--ink); color:var(--paper);
  border-radius:999px; padding:16px 26px; font-size:1.05rem; font-weight:800;
  box-shadow:0 6px 18px rgba(20,20,20,.25); display:flex; align-items:center; gap:8px;
}
.fab:active{transform:translateX(-50%) scale(.97);}

/* ---------- 검색/토글/빈화면 ---------- */
.search{
  width:100%; min-height:52px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--card); padding:0 16px; font-size:1rem; color:var(--ink);
}
.search::placeholder{color:#A6A49C;}
.toggle-closed{width:100%; border:none; background:none; color:var(--ink2); font-weight:700; padding:12px; font-size:.95rem;}
.empty{color:var(--ink2); text-align:center; padding:48px 24px; font-size:1rem; line-height:1.7;}
.notice{background:var(--mag-bg); color:var(--mag); border-radius:var(--r); padding:14px 16px; margin:16px; font-weight:700; display:flex; gap:12px; align-items:center;}
.notice button{border:1px solid var(--mag); background:none; color:var(--mag); border-radius:10px; padding:8px 14px; font-weight:800; flex:none;}

/* ---------- 폼 ---------- */
.field{margin-bottom:16px;}
.field label{display:block; font-size:.92rem; font-weight:700; color:var(--ink2); margin-bottom:7px;}
.field label b{color:var(--mag);}
.input{
  width:100%; min-height:54px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--card); padding:0 16px; font-size:1.05rem; color:var(--ink);
}
textarea.input{min-height:96px; padding:14px 16px; resize:vertical; line-height:1.5;}
.input:focus, .search:focus{outline:3px solid var(--cyan); outline-offset:0; border-color:var(--cyan);}
.seg{display:flex; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--card);}
.seg button{flex:1; min-height:52px; border:none; background:none; font-size:1rem; font-weight:700; color:var(--ink2);}
.seg button.on{background:var(--ink); color:var(--paper); font-weight:800;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.hint{font-size:.85rem; color:var(--ink2); margin-top:6px;}

/* ---------- 토스트 ---------- */
#toast{
  position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:12px 22px; border-radius:999px;
  font-weight:700; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s;
}
#toast.show{opacity:1;}

/* ---------- 잠금 화면 ---------- */
#lock{
  position:fixed; inset:0; z-index:200; background:var(--paper);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:24px;
}
#lock .cbar i{width:14px; height:14px;}
#lock h2{font-size:1.4rem; font-weight:800; margin:14px 0 2px;}
#lock p{color:var(--ink2); margin:0 0 18px;}
.dots{display:flex; gap:16px; margin-bottom:26px;}
.dots i{width:16px; height:16px; border-radius:50%; border:2px solid var(--ink); background:none;}
.dots i.on{background:var(--ink);}
.pad{display:grid; grid-template-columns:repeat(3,78px); gap:14px;}
.pad button{
  width:78px; height:78px; border-radius:50%; border:1px solid var(--line);
  background:var(--card); font-size:1.7rem; font-weight:700; color:var(--ink);
}
.pad button:active{background:#EFEEE8;}
.pad button.ghost{border:none; background:none; font-size:1.3rem;}
#lockmsg{color:var(--mag); font-weight:700; min-height:1.4em; margin-top:16px;}
.shake{animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important;}
}
@media (min-width:600px){
  .grid2-wide{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
}
</style>
</head>
<body>

<div id="lock" hidden>
  <span class="cbar"><i></i><i></i><i></i><i></i></span>
  <h2>복합기 렌탈장부</h2>
  <p>비밀번호 4자리를 눌러주세요</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
  <div id="lockmsg"></div>
</div>

<div id="app"></div>
<div id="toast"></div>

<script>
/* ================= 설정 ================= */
const SUPABASE_URL = 'https://kpezbitaayksznqgyfbz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwZXpiaXRhYXlrc3pucWd5ZmJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjQ5MjUsImV4cCI6MjEwMTk0MDkyNX0.HMkFYFNooQhG54Xy82asf3HokgYQMTl1YWEdUY83Jy8';
const PIN = '0311';
const API = SUPABASE_URL + '/rest/v1';
const BASE_HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
};

/* ================= 저장소(안전 래퍼) ================= */
function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function safeDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* ================= 상태 ================= */
const state = {
  companies: [],
  machines: [],
  loaded: false,
  error: null,
  q: '',
  showClosed: false
};

/* ================= 유틸 ================= */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayD(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parseD(s){
  if(!s) return null;
  const p = String(s).split('T')[0].split('-');
  if(p.length < 3) return null;
  return new Date(+p[0], +p[1]-1, +p[2]);
}
function fmtD(s){
  const d = parseD(s);
  if(!d) return '';
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}
function diffDays(a, b){ return Math.round((a - b) / 86400000); }
function fmtDateObj(d){
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}
function addMonths(d, n){ const x = new Date(d.getTime()); x.setMonth(x.getMonth() + n); return x; }
function elapsedText(s){
  const d = parseD(s);
  if(!d) return '';
  const t = todayD();
  let m = (t.getFullYear() - d.getFullYear()) * 12 + (t.getMonth() - d.getMonth());
  if(t.getDate() < d.getDate()) m--;
  if(m < 0) m = 0;
  const y = Math.floor(m / 12), mm = m % 12;
  if(y > 0) return y + '년 ' + mm + '개월째';
  if(mm > 0) return mm + '개월째';
  return '이번 달 시작';
}
function money(n){
  if(n === null || n === undefined || n === '') return '';
  const v = Number(n);
  if(Number.isInteger(v)) return v.toLocaleString('ko-KR');
  return v.toLocaleString('ko-KR', {maximumFractionDigits: 2});
}
function fmtPhone(v){
  const d = String(v || '').replace(/\D/g, '').slice(0, 11);
  if(d.startsWith('02')){
    if(d.length < 3) return d;
    if(d.length < 6) return d.replace(/(\d{2})(\d+)/, '$1-$2');
    if(d.length < 10) return d.replace(/(\d{2})(\d{3})(\d+)/, '$1-$2-$3');
    return d.replace(/(\d{2})(\d{4})(\d{4})/, '$1-$2-$3');
  }
  if(d.length < 4) return d;
  if(d.length < 8) return d.replace(/(\d{3})(\d+)/, '$1-$2');
  if(d.length < 11) return d.replace(/(\d{3})(\d{3})(\d+)/, '$1-$2-$3');
  return d.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ================= Supabase REST ================= */
async function req(path, opt){
  opt = opt || {};
  const headers = Object.assign({}, BASE_HEADERS, opt.headers || {});
  const res = await fetch(API + path, Object.assign({}, opt, { headers }));
  if(!res.ok){
    const txt = await res.text().catch(() => '');
    throw new Error('HTTP ' + res.status + ' ' + txt);
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
async function loadAll(silent){
  try{
    const [cs, ms] = await Promise.all([
      req('/companies?select=*&order=created_at.asc'),
      req('/machines?select=*&order=created_at.asc')
    ]);
    state.companies = cs || [];
    state.machines = ms || [];
    state.loaded = true;
    state.error = null;
    render();
    if(!silent) toast('최신 내용으로 불러왔어요');
  }catch(e){
    state.error = e.message;
    if(!state.loaded) render();
    else if(!silent) toast('불러오지 못했어요. 인터넷을 확인해주세요');
  }
}
async function insertRow(table, data){
  const rows = await req('/' + table, {
    method: 'POST',
    headers: { 'Prefer': 'return=representation' },
    body: JSON.stringify(data)
  });
  return rows[0];
}
async function updateRow(table, id, data){
  data.updated_at = new Date().toISOString();
  const rows = await req('/' + table + '?id=eq.' + id, {
    method: 'PATCH',
    headers: { 'Prefer': 'return=representation' },
    body: JSON.stringify(data)
  });
  return rows[0];
}
async function deleteRow(table, id){
  await req('/' + table + '?id=eq.' + id, { method: 'DELETE' });
}

/* ================= 칩 계산 ================= */
function visitChip(dateStr, forHome){
  if(!dateStr) return forHome ? '' : '<span class="chip gray">미정</span>';
  const dd = diffDays(parseD(dateStr), todayD());
  if(dd < 0)  return '<span class="chip mag">방문 ' + (-dd) + '일 지남</span>';
  if(dd === 0) return '<span class="chip fill-mag">오늘 방문</span>';
  if(dd <= 7) return '<span class="chip fill-cyan">방문 D-' + dd + '</span>';
  return '<span class="chip gray">방문 D-' + dd + '</span>';
}
function machineChips(m){
  const chips = [];
  if(m.start_date){
    chips.push('<span class="chip gray">계약 ' + elapsedText(m.start_date) + '</span>');
    if(m.contract_months){
      const end = addMonths(parseD(m.start_date), m.contract_months);
      const dd = diffDays(end, todayD());
      if(dd < 0) chips.push('<span class="chip mag">만료 ' + (-dd) + '일 지남</span>');
      else if(dd <= 30) chips.push('<span class="chip yel">만료 D-' + dd + '</span>');
      else chips.push('<span class="chip gray">만료 ' + fmtDateObj(end) + '</span>');
    }
  }
  if(m.toner_date){
    const days = diffDays(todayD(), parseD(m.toner_date));
    let cls = 'gray';
    if(days >= 150) cls = 'mag';
    else if(days >= 90) cls = 'yel';
    chips.push('<span class="chip ' + cls + '">토너 ' + days + '일째</span>');
  }
  return chips.join('');
}

/* ================= 라우팅 ================= */
function nav(hash){ location.hash = hash; }
function navReplace(hash){
  try{ history.replaceState(null, '', hash); }catch(e){ location.hash = hash; return; }
  render();
}
window.addEventListener('hashchange', render);

/* ================= 렌더 ================= */
function render(){
  const app = document.getElementById('app');
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h ? h.split('/') : [];
  window.scrollTo(0, 0);

  if(!state.loaded){
    app.innerHTML = headerHTML('복합기 렌탈장부', false) +
      (state.error
        ? '<div class="notice"><span>불러오지 못했어요.<br>인터넷 연결을 확인해주세요.</span><button onclick="loadAll()">다시 시도</button></div>'
        : '<div class="empty">불러오는 중…</div>');
    return;
  }

  if(parts[0] === 'c' && parts[1]) return renderDetail(parts[1]);
  if(parts[0] === 'cf') return renderCompanyForm(parts[1] || null);
  if(parts[0] === 'mf' && parts[1]) return renderMachineForm(parts[1], parts[2] || null);
  renderHome();
}

function headerHTML(title, showTools, backHash){
  return '<div class="topbar">' +
    (backHash !== undefined
      ? '<button class="backbtn" onclick="nav(\'' + backHash + '\')" aria-label="뒤로">←</button>'
      : '') +
    '<h1><span>' + esc(title) + '</span>' +
    (backHash === undefined ? '<span class="cbar"><i></i><i></i><i></i><i></i></span>' : '') +
    '</h1>' +
    (showTools
      ? '<button class="iconbtn" onclick="loadAll()" title="새로고침" aria-label="새로고침">↻</button>' +
        '<button class="iconbtn" onclick="relock()" title="잠금" aria-label="잠금">🔒</button>'
      : '') +
    '</div>';
}

function machinesOf(cid){ return state.machines.filter(m => m.company_id === cid); }

function matchQ(c){
  const q = state.q.trim().toLowerCase();
  if(!q) return true;
  const ms = machinesOf(c.id);
  const pool = [c.name, c.contact_name, c.phone, c.address, c.memo]
    .concat(ms.map(m => m.model)).concat(ms.map(m => m.serial_no));
  return pool.some(v => v && String(v).toLowerCase().includes(q));
}

function renderHome(){
  const app = document.getElementById('app');
  app.innerHTML =
    headerHTML('복합기 렌탈장부', true) +
    '<div class="section" style="padding-bottom:8px;">' +
      '<input class="search" id="searchbox" type="search" placeholder="업체명·담당자·기기 검색" value="' + esc(state.q) + '">' +
    '</div>' +
    '<div class="section" id="colist" style="padding-top:4px;"></div>' +
    '<button class="fab" onclick="nav(\'#cf\')">＋ 업체 추가</button>';

  const sb = document.getElementById('searchbox');
  sb.addEventListener('input', () => { state.q = sb.value; renderHomeList(); });
  renderHomeList();
}

function renderHomeList(){
  const box = document.getElementById('colist');
  if(!box) return;

  const all = state.companies.filter(matchQ);
  const active = all.filter(c => c.status !== '해지');
  const closed = all.filter(c => c.status === '해지');

  active.sort((a, b) => {
    const da = a.visit_date ? parseD(a.visit_date).getTime() : Infinity;
    const db = b.visit_date ? parseD(b.visit_date).getTime() : Infinity;
    if(da !== db) return da - db;
    return (a.name || '').localeCompare(b.name || '', 'ko');
  });
  closed.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'));

  if(state.companies.length === 0){
    box.innerHTML = '<div class="empty">아직 등록한 업체가 없어요.<br>아래 <b>＋ 업체 추가</b> 버튼으로<br>첫 업체를 등록해보세요.</div>';
    return;
  }
  if(all.length === 0){
    box.innerHTML = '<div class="empty">검색 결과가 없어요.</div>';
    return;
  }

  let html = active.map(coCardHTML).join('');
  if(closed.length){
    html += '<button class="toggle-closed" onclick="toggleClosed()">' +
      (state.showClosed ? '▲ 해지한 업체 접기' : '▼ 해지한 업체 ' + closed.length + '곳 보기') +
      '</button>';
    if(state.showClosed) html += closed.map(coCardHTML).join('');
  }
  box.innerHTML = html;
}

function toggleClosed(){ state.showClosed = !state.showClosed; renderHomeList(); }

function coCardHTML(c){
  const ms = machinesOf(c.id);

  const digits = String(c.phone || '').replace(/\D/g, '');
  const info = [];
  if(c.contact_name) info.push(esc(c.contact_name));
  if(c.visit_date) info.push('방문 ' + fmtD(c.visit_date));
  return '<div class="card co-card' + (closed ? ' closed' : '') + '" onclick="nav(\'#c/' + c.id + '\')">' +
    '<div class="row1">' +
      '<div class="name">' + esc(c.name) + '</div>' +
      (digits
        ? '<a class="callbtn" href="tel:' + digits + '" onclick="event.stopPropagation()">📞 전화</a>'
        : '') +
    '</div>' +
    '<div class="row2">' +
      (closed ? '<span class="chip gray">해지</span>' : visitChip(c.visit_date, true)) +
      '<span class="chip gray">기기 ' + ms.length + '대</span>' +
      (info.length ? '<span>' + info.join(' · ') + '</span>' : '') +

}

function machineCardHTML(m){
  const lines = [];
  if(m.rental_type === '매수제' && (m.mono_pages || m.color_pages)){
    const p = [];
    if(m.mono_pages) p.push('흑백 <b>' + money(m.mono_pages) + '</b>장');
    if(m.color_pages) p.push('컬러 <b>' + money(m.color_pages) + '</b>장');
    lines.push('<span class="lbl">월 기본</span> ' + p.join(' · '));
  }
  const fee = [];
  if(m.base_fee !== null && m.base_fee !== undefined) fee.push('기본료 <b>' + money(m.base_fee) + '</b>원');
  if(m.mono_over_fee !== null && m.mono_over_fee !== undefined) fee.push('초과 흑백 <b>' + money(m.mono_over_fee) + '</b>원/장');
  if(m.color_over_fee !== null && m.color_over_fee !== undefined) fee.push('초과 컬러 <b>' + money(m.color_over_fee) + '</b>원/장');
  if(fee.length) lines.push('<span class="lbl">요금</span> ' + fee.join(' · '));
  if(m.start_date) lines.push('<span class="lbl">계약 시작</span> <b>' + fmtD(m.start_date) + '</b>' + (m.contract_months ? ' · ' + m.contract_months + '개월 계약' : ''));
  if(m.toner_date) lines.push('<span class="lbl">토너 교체</span> <b>' + fmtD(m.toner_date) + '</b>');

  return '<div class="card mc">' +
    '<div class="head">' +
      '<div style="flex:1;min-width:0;">' +
        '<div class="model">' + esc(m.model) + '</div>' +
        (m.serial_no ? '<div class="serial">관리번호 ' + esc(m.serial_no) + '</div>' : '') +
      '</div>' +
      '<span class="chip gray">' + esc(m.rental_type || '매수제') + '</span>' +
      '<button class="editlink" onclick="nav(\'#mf/' + m.company_id + '/' + m.id + '\')">수정</button>' +
    '</div>' +
    '<div class="chips">' + machineChips(m) + '</div>' +
    lines.map(l => '<div class="info">' + l + '</div>').join('') +
    (m.memo ? '<div class="memo">' + esc(m.memo) + '</div>' : '') +
  '</div>';
}

function field(label, inner){ return '<div class="field"><label>' + label + '</label>' + inner + '</div>'; }
function segHTML(id, opts, cur){
  return '<div class="seg" id="' + id + '" data-val="' + esc(cur) + '">' +
    opts.map(o => '<button type="button" class="' + (o === cur ? 'on' : '') + '" onclick="segPick(\'' + id + '\',\'' + o + '\')">' + o + '</button>').join('') +
    '</div>';
}
function segPick(id, val){
  const el = document.getElementById(id);
  el.dataset.val = val;
  Array.from(el.children).forEach(b => b.classList.toggle('on', b.textContent === val));
  if(id === 'm_type') toggleTypeFields(val);
}

async function saveCompany(cid){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('업체명을 입력해주세요'); document.getElementById('f_name').focus(); return; }
  const data = {
    name,
    contact_name: valOrNull('f_contact'),
    phone: valOrNull('f_phone'),
    address: valOrNull('f_addr'),
    visit_date: valOrNull('f_visit'),
    status: document.getElementById('f_status').dataset.val,
    memo: valOrNull('f_memo')
  };
  try{
    if(cid){
      const row = await updateRow('companies', cid, data);
      const i = state.companies.findIndex(x => x.id === cid);
      if(i > -1) state.companies[i] = row;
      toast('저장했어요');
      navReplace('#c/' + cid);
    }else{
      const row = await insertRow('companies', data);
      state.companies.push(row);
      toast('업체를 추가했어요');
      navReplace('#c/' + row.id);
    }
  }catch(e){ toast('저장하지 못했어요. 인터넷을 확인해주세요'); }
}
async function removeCompany(cid){
  const ms = machinesOf(cid).length;
  if(!confirm('이 업체를 삭제할까요?' + (ms ? '\n등록된 기기 ' + ms + '대 기록도 함께 삭제됩니다.' : ''))) return;
  try{
    await deleteRow('companies', cid);
    state.companies = state.companies.filter(x => x.id !== cid);
    state.machines = state.machines.filter(x => x.company_id !== cid);
    toast('삭제했어요');
    navReplace('#');
  }catch(e){ toast('삭제하지 못했어요. 인터넷을 확인해주세요'); }
}
function valOrNull(id){
  const v = document.getElementById(id).value.trim();
  return v === '' ? null : v;
}
function numOrNull(id){
  const v = document.getElementById(id).value.trim().replace(/,/g, '');
  if(v === '') return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

function numInput(id, val, dec){
  const v = (val === null || val === undefined) ? '' : val;
  return '<input class="input" id="' + id + '" inputmode="' + (dec ? 'decimal' : 'numeric') + '" value="' + esc(v) + '" placeholder="숫자">';
}
function toggleTypeFields(type){
  const show = type === '매수제';
  const p = document.getElementById('pagesFields');
  const o = document.getElementById('overFields');
  if(p) p.style.display = show ? '' : 'none';
  if(o) o.style.display = show ? '' : 'none';
}

async function saveMachine(cid, mid){
  const model = document.getElementById('m_model').value.trim();
  if(!model){ toast('모델명을 입력해주세요'); document.getElementById('m_model').focus(); return; }
  const type = document.getElementById('m_type').dataset.val;
  const data = {

    serial_no: valOrNull('m_serial'),
    rental_type: type,

    color_pages: type === '매수제' ? numOrNull('m_color') : null,
    start_date: valOrNull('m_start'),
    contract_months: numOrNull('m_months'),
    toner_date: valOrNull('m_toner'),
    base_fee: numOrNull('m_fee'),
    mono_over_fee: type === '매수제' ? numOrNull('m_mono_over') : null,
    color_over_fee: type === '매수제' ? numOrNull('m_color_over') : null,
    memo: valOrNull('m_memo')
  };
  try{
    if(mid){
      const row = await updateRow('machines', mid, data);
      const i = state.machines.findIndex(x => x.id === mid);
      if(i > -1) state.machines[i] = row;
      toast('저장했어요');
    }else{
      const row = await insertRow('machines', data);
      state.machines.push(row);
      toast('기기를 추가했어요');
    }
    navReplace('#c/' + cid);
  }catch(e){ toast('저장하지 못했어요. 인터넷을 확인해주세요'); }
}
async function removeMachine(mid, cid){
  if(!confirm('이 기기를 삭제할까요?')) return;
  try{
    await deleteRow('machines', mid);
    state.machines = state.machines.filter(x => x.id !== mid);
    toast('삭제했어요');
    navReplace('#c/' + cid);
  }catch(e){ toast('삭제하지 못했어요. 인터넷을 확인해주세요'); }
}

/* ================= 잠금 ================= */
let pinBuf = '';
function buildPad(){
  const pad = document.getElementById('pad');
  const keys = ['1','2','3','4','5','6','7','8','9','', '0', '←'];
  pad.innerHTML = keys.map(k => {
    if(k === '') return '<button class="ghost" disabled></button>';
    if(k === '←') return '<button class="ghost" onclick="pinKey(\'del\')" aria-label="지우기">←</button>';
    return '<button onclick="pinKey(\'' + k + '\')">' + k + '</button>';
  }).join('');
}
function pinKey(k){
  if(k === 'del') pinBuf = pinBuf.slice(0, -1);
  else if(pinBuf.length < 4) pinBuf += k;
  const dots = document.querySelectorAll('#dots i');
  dots.forEach((d, i) => d.classList.toggle('on', i < pinBuf.length));
  document.getElementById('lockmsg').textContent = '';
  if(pinBuf.length === 4){
    if(pinBuf === PIN){
      safeSet('rl_unlock', '1');
      unlock();
    }else{
      const box = document.getElementById('dots');
      box.classList.remove('shake');
      void box.offsetWidth;
      box.classList.add('shake');
      document.getElementById('lockmsg').textContent = '비밀번호가 달라요';
      pinBuf = '';
      setTimeout(() => dots.forEach(d => d.classList.remove('on')), 250);
    }
  }
}
function unlock(){
  document.getElementById('lock').hidden = true;
  loadAll(true);
  render();
}
function relock(){
  if(!confirm('잠금 화면으로 돌아갈까요?')) return;
  safeDel('rl_unlock');
  location.reload();
}

/* ================= 시작 ================= */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && state.loaded && document.getElementById('lock').hidden){
    loadAll(true);
  }
});
buildPad();
if(safeGet('rl_unlock') === '1'){
  unlock();
}else{
  document.getElementById('lock').hidden = false;
  render();
}
if('serviceWorker' in navigator){
  try{ navigator.serviceWorker.register('./sw.js'); }catch(e){}
}
